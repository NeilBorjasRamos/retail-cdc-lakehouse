name: Bug report
description: Report a reproducible correctness or execution issue without private data.
body:
  - type: textarea
    id: problem
    attributes:
      label: Trigger and expected behavior
      description: Use fictional records only. Include publication generation and error type.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include OS, Python version, commit, command and observed behavior; redact secrets.
    validations:
      required: true
