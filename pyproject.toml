[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-cdc-lakehouse"
version = "0.1.0"
description = "Recoverable CDC materialization with Apache Iceberg and atomic snapshot publications"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "pyiceberg[sql-sqlite,pyarrow]==0.12.0",
  "pyarrow==22.0.0",
  "duckdb==1.4.3",
  "filelock==3.20.0",
  "confluent-kafka==2.8.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==6.2.1", "ruff==0.14.2"]

[project.scripts]
retail = "retail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["retail"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
